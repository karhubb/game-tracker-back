spring.application.name=backend-api

# ── Base de datos ──────────────────────────────────────────────────────────────
# En producción (Render) estas variables vienen del entorno.
# En local puedes crear un archivo .env o setearlas manualmente,
# o bien descomentar el bloque H2 de abajo para desarrollo sin Aiven.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Descomenta esto para desarrollo local con H2 (sin Aiven) ──────────────────
# spring.datasource.url=jdbc:h2:mem:gametracker
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT ────────────────────────────────────────────────────────────────────────
gametracker.app.jwtSecret=${JWT_SECRET}
gametracker.app.jwtExpirationMs=86400000

# ── Admin por defecto ──────────────────────────────────────────────────────────
gametracker.app.admin.enabled=true
gametracker.app.admin.username=admin
gametracker.app.admin.email=admin@gametracker.local
gametracker.app.admin.password=${ADMIN_PASSWORD}